<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Connexion - Attendance App</title>
        <style>
            * { box-sizing: border-box; }
            body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .login-card {
                background: white;
                padding: 2.5rem 3rem;
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 420px;
            }
            h1 {
                margin: 0 0 0.3rem;
                color: #1e3a8a;
                font-size: 1.8rem;
                text-align: center;
            }
            .subtitle {
                text-align: center;
                color: #64748b;
                margin: 0 0 2rem;
                font-size: 0.9rem;
            }
            .form-group {
                margin-bottom: 1.2rem;
            }
            label {
                display: block;
                color: #334155;
                font-weight: 600;
                margin-bottom: 0.4rem;
                font-size: 0.9rem;
            }
            input[type="text"], input[type="password"] {
                width: 100%;
                padding: 0.7rem 1rem;
                border: 2px solid #e2e8f0;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.2s;
            }
            input[type="text"]:focus, input[type="password"]:focus {
                outline: none;
                border-color: #3b82f6;
            }
            .btn-submit {
                width: 100%;
                padding: 0.8rem;
                background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                margin-top: 0.5rem;
                transition: transform 0.1s;
            }
            .btn-submit:hover { transform: translateY(-1px); }
            .btn-submit:active { transform: translateY(0); }
            .error-message {
                background: #fee2e2;
                color: #991b1b;
                padding: 0.7rem 1rem;
                border-radius: 8px;
                border-left: 4px solid #dc2626;
                margin-bottom: 1.2rem;
                font-size: 0.9rem;
            }
            .footer-hint {
                margin-top: 1.5rem;
                padding-top: 1.5rem;
                border-top: 1px solid #e2e8f0;
                text-align: center;
                color: #64748b;
                font-size: 0.8rem;
            }
            .footer-hint code {
                background: #f1f5f9;
                padding: 2px 6px;
                border-radius: 4px;
                font-family: 'Courier New', monospace;
                color: #1e3a8a;
            }
        </style>
    </h:head>
    <h:body>
        <div class="login-card">
            <h1>Attendance App</h1>
            <p class="subtitle">Système de gestion des absences IUGB</p>

            <h:form id="loginForm">

                <h:messages globalOnly="true" layout="list"
                            infoClass="error-message"
                            errorClass="error-message"
                            warnClass="error-message"/>

                <div class="form-group">
                    <label for="userName">Identifiant</label>
                    <h:inputText id="userName"
                                 value="#{loginBean.userName}"
                                 autocomplete="username"
                                 required="true"
                                 requiredMessage="Veuillez saisir votre identifiant"/>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <h:inputSecret id="password"
                                   value="#{loginBean.password}"
                                   autocomplete="current-password"
                                   required="true"
                                   requiredMessage="Veuillez saisir votre mot de passe"/>
                </div>

                <h:commandButton value="Se connecter"
                                 action="#{loginBean.doLogin}"
                                 styleClass="btn-submit"/>

             

            </h:form>
        </div>
    </h:body>
</html>
